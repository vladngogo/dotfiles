name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck install.sh
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .

  installer-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test installer and Corgi annotations
        run: python -m unittest discover -s tests -v

  agent-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test agent-eval
        run: python -m unittest discover -s agents/tests -v

  editor-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@master
      - name: Install native editor toolchain
        run: brew install neovim tree-sitter-cli gopls
      - name: Verify fresh and repeated parser setup
        run: bash tests/smoke_nvim.sh

  # Stable names preserve the existing branch-protection checks. The installer
  # gate also requires the networked smoke checks on both platforms.
  installer:
    needs: [installer-tests, editor-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$TESTS" = success && test "$SMOKE" = success
        env:
          TESTS: ${{ needs.installer-tests.result }}
          SMOKE: ${{ needs.editor-smoke.result }}

  agent-eval:
    needs: [agent-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.agent-tests.result }}
