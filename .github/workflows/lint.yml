name: lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck install.sh
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .

  platform-tests:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test installer and Corgi annotations
        timeout-minutes: 10
        run: python -m unittest discover -s tests -v
      - name: Test agent-eval
        timeout-minutes: 10
        run: python -m unittest discover -s agents/tests -v
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Install native editor toolchain
        run: brew install neovim tree-sitter-cli gopls
      - name: Verify fresh and repeated parser setup
        run: bash tests/smoke_nvim.sh

  # Stable names preserve branch protection while sharing native runners.
  installer:
    needs: [platform-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.platform-tests.result }}

  agent-eval:
    needs: [platform-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.platform-tests.result }}
