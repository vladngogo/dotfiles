name: pr-review

# Automated PR review. Runs when a PR is opened, leaves draft, is reopened,
# and on every push to it (one paid review per push; a newer push cancels an
# in-flight review via `concurrency`).
#
# Provider: DeepSeek, through its Anthropic-compatible endpoint, driving
# claude-code-action. Instructions live in .github/review-prompt.md, so the
# provider is swappable without touching them:
#   - Anthropic: drop ANTHROPIC_BASE_URL and --model, use an Anthropic key.
#   - OpenAI: replace this step with openai/codex-action plus `gh pr comment`.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The checkout is only the PR merge commit; fetch the base so the
      # reviewer can diff and compare against it.
      - name: Fetch base branch
        run: git fetch --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Build prompt
        id: prompt
        run: |
          {
            echo "text<<PROMPT_EOF"
            echo "REPO: ${{ github.repository }}"
            echo "PR NUMBER: ${{ github.event.pull_request.number }}"
            echo
            cat .github/review-prompt.md
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
        with:
          anthropic_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          # Plain Actions token: no Claude GitHub App or Anthropic token
          # exchange needed. Comments post as github-actions[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model deepseek-v4-pro
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
