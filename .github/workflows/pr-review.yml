name: pr-review

# Automated PR review. Runs when a PR is opened, leaves draft, is reopened,
# and on every push to it (one paid review per push; a newer push cancels an
# in-flight review via `concurrency`).
#
# Provider: DeepSeek, through its Anthropic-compatible endpoint, driving
# claude-code-action. Instructions live in .github/review-prompt.md, so the
# provider is swappable without touching them:
#   - Anthropic: drop ANTHROPIC_BASE_URL and --model, use an Anthropic key.
#   - OpenAI: replace this step with openai/codex-action plus `gh pr comment`.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The diff, AGENTS.md files and earlier threads go into the prompt, so
      # the reviewer doesn't spend slow turns fetching them.
      - name: Build prompt
        id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A random delimiter, so no line in the diff can end the output early.
          eof="PROMPT_EOF_$(openssl rand -hex 16)"
          {
            echo "text<<$eof"
            .github/scripts/review-prompt.sh "${{ github.repository_owner }}" \
              "${{ github.event.repository.name }}" "${{ github.event.pull_request.number }}"
            echo "$eof"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        id: review
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
        with:
          anthropic_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          # Plain Actions token: no Claude GitHub App or Anthropic token
          # exchange needed. Comments post as github-actions[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # No progress comment: it adds turns and a generic prompt, and the
          # verdict comes back as structured output instead.
          track_progress: false
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model deepseek-v4-pro
            --max-turns 15
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["looks good","needs changes"]}},"required":["verdict"]}'

      # Fail the job unless this run's verdict is "looks good", so branch
      # protection can require it. The verdict is the model's structured
      # output, not parsed from comments. After declining a finding without a
      # push, re-run this job to get a fresh verdict.
      - name: Check verdict
        env:
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
        run: printf '%s' "$STRUCTURED_OUTPUT" | .github/scripts/review-verdict.sh
