name: claude-review

# Automated PR review. Runs once when a PR is opened (or leaves draft / is
# reopened). Add `synchronize` to `types` to re-review on every push; that
# costs a review per push.
on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Set one of these repo secrets. Subscription: run `claude setup-token`
          # locally and save it as CLAUDE_CODE_OAUTH_TOKEN. API: ANTHROPIC_API_KEY.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read AGENTS.md (and any AGENTS.md in
            touched directories) first: its rules are the project's standards,
            and breaking one is a finding.

            Report, most severe first:
            1. Correctness bugs: give the concrete input or state that breaks.
            2. Security problems: secrets, injection, unsafe file or shell use.
            3. Violations of AGENTS.md rules or hard constraints.
            4. Missing tests for changed behaviour.

            Rules:
            - Only report issues you can point to in the diff and would defend.
              No style nits, no praise, no restating what the PR does.
            - Put each specific issue on its line as an inline comment.
            - Finish with one top-level comment via `gh pr comment`: a verdict
              (looks good / needs changes) and the issues ranked. If you found
              nothing, say so in one line.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
