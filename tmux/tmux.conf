# ============================================================
#  .tmux.conf — minimal, rational defaults
# ============================================================

# ── Prefix: Ctrl-a (easier than Ctrl-b) ─────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # Ctrl-a Ctrl-a sends literal Ctrl-a

# ── General ──────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"  # true color in WSL
set -g history-limit 10000
set -g mouse on                                   # click to select pane/window
set -g base-index 1                               # windows start at 1, not 0
setw -g pane-base-index 1                         # panes too
set -g renumber-windows on                        # close window 2 → window 3 becomes 2
set -sg escape-time 0                             # no delay for nvim Escape key
set -g focus-events on                            # lets nvim know when it gains focus

# ── Vim-style copy mode ──────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ── Splits (open in current directory) ──────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Pane navigation (Ctrl-hjkl, no prefix needed) ───────────
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# ── Pane resizing (prefix + HJKL) ───────────────────────────
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# ── Window navigation ────────────────────────────────────────
bind -n M-h previous-window   # Alt-h / Alt-l to move between windows
bind -n M-l next-window

# ── Reload config ────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ── Status bar ───────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#a9b1d6"      # tokyonight-night colours

set -g status-left-length 40
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[default] "

set -g status-right-length 60
set -g status-right "#[fg=#565f89] %H:%M  %d %b "

set -g window-status-format         " #I:#W "
set -g window-status-current-format "#[bg=#7aa2f7,fg=#1a1b26,bold] #I:#W "

set -g pane-border-style        "fg=#2a2b3d"
set -g pane-active-border-style "fg=#7aa2f7"
