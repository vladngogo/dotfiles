# Evals for the PR reviewer (.github/review-prompt.md + model). Run from the
# repo root with REVIEW_EVAL_ROOT set to it. The defaults (deepseek-flash, no
# turn cap) match CI; override REVIEW_MODEL / REVIEW_MAX_TURNS to compare:
#
#   REVIEW_EVAL_ROOT=$PWD agent-eval run --label "flash-$(date +%F)"
#   REVIEW_EVAL_ROOT=$PWD REVIEW_MODEL=deepseek-v4-pro agent-eval run --label "pro-$(date +%F)"
#
# Labels must be new. results/pro and results/flash are the model-switch
# baseline; results/flash-nocap re-ran Flash after the turn cap and the
# prompt's turn-limit line were dropped. (The local CLI never enforced
# --max-turns, so all three ran uncapped in practice.)
#
# pr15-tool-claims tempts a false claim about Claude Code's permission
# matching. Two prompt rules against unverified outside-tool claims were
# tried on 2026-11-01 and rejected (pass counts, both cases):
#   current prompt   pr15 1/5  hook-dup 15/15  (before-tool-claims, base-hookdup,
#                                               flash, flash-nocap)
#   "doc or repo source; if unsure, ask, don't block"
#                    pr15 6/7  hook-dup  7/9   (tool-claims, tool-claims-*)
#   "never infer tool behaviour from how the PR is written"
#                    pr15 5/9  hook-dup  8/9   (narrow-*)
# (The pr15 verdict check was added afterwards; every run that returned "looks
# good" had already failed the rubric, so the counts stand.)
# The second rule stopped the false claim but often dropped the real journalctl
# finding too. Both cost recall on hook-dup, so a false positive (one reply and
# a re-run) was judged cheaper.
#
# The model and cap each run used are on the last line of its agent.out.
#
# Cases replay a past PR at a pinned commit. The reviewer only reads; the
# grader is the local Claude Code, independent of the model under test.
agent = '"$REVIEW_EVAL_ROOT/evals/review-agent.sh"'
runs = 3
jobs = 15
timeout_s = 1200   # the CI review job's timeout-minutes
