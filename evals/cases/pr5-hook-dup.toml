# PR #5, first round. The reviewer caught that merging hooks by deep equality
# re-adds the repo's guard hook when the local file groups it differently.
id = "pr5-hook-dup"
base = "8a029ec"

prompt = """
PR_BASE=205fed3
PR #5: Merge Claude settings into the local file instead of linking it.
claude/merge-settings merges claude/settings.json into ~/.claude/settings.json:
objects merge recursively, lists gain missing items, local values win.
"""

checks = [
  'test "$(cat "$(git rev-parse --git-dir)/eval-verdict")" = "needs changes"',
]

rubric = [
  "The review reports that the list merge compares hook matcher groups by whole-object equality, so a repo hook (such as guard-bash) is appended again, or duplicated, when the local settings already contain it in a differently shaped group.",
  "Every finding the review reports points at something real in the diff; none is invented or plainly wrong.",
]
