# PR #7, final round: the reviewer approved it with no findings.
# Catches a model that finds problems in everything.
id = "pr7-clean"
base = "d09cbcb"   # the PR's base; the reviewer checks out PR_HEAD

prompt = """
PR_HEAD=a9b38e0
PR #7: Speed up PR review: inline the diff and AGENTS.md, cap turns.
"""

checks = [
  'test "$(cat "$(git rev-parse --git-dir)/eval-verdict")" = "looks good"',
]

rubric = [
  "The review raises no finding that would block the merge, or any blocking finding it raises is a real defect in the diff.",
]
